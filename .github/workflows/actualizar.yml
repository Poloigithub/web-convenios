name: Actualizar convenios y publicar web

on:
  schedule:
    - cron: "30 5 * * *"        # 07:30 en España (invierno 06:30)
  workflow_dispatch: {}          # botón para lanzarlo a mano
  push:
    branches: [main]             # re-publica la web al cambiar el código

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    outputs:
      hay_problemas: ${{ steps.recoger.outputs.hay_problemas }}
      problemas: ${{ steps.recoger.outputs.problemas }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Solo biblioteca estándar: no hay pip install.
      # Si una fuente se rompe, este paso NO falla: deja constancia en
      # sus outputs y avisa por Telegram, para que la web se publique
      # igualmente con los datos que ya había.
      - name: Recoger convenios (ventana de 10 días)
        id: recoger
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m scraper.actualizar

      - name: Guardar BBDD actualizada en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/convenios.sqlite datos/convenios.json
          if ! git diff --cached --quiet; then
            git commit -m "Datos: pasada del $(date -u +%F)"
            git pull --rebase origin main
            git push
          else
            echo "Sin cambios en los datos."
          fi

      - name: Construir la web (Tailwind)
        run: |
          curl -sL -o tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss
          mkdir -p _site/datos
          ./tailwindcss -i web/tailwind.css -o _site/estilos.css --minify
          cp web/index.html web/app.js _site/
          cp datos/convenios.json _site/datos/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Se ejecuta SIEMPRE, y solo después de haber publicado: marca la
  # ejecución en rojo si alguna fuente falló. Así GitHub manda su correo
  # automático de "workflow failed" sin haber impedido la publicación.
  salud:
    needs: [actualizar, publicar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el estado de las fuentes
        # Por variables de entorno y no interpolando en el script: el
        # texto de los problemas incluye mensajes de error de portales
        # externos y no debe acabar dentro de un comando de shell.
        env:
          HAY_PROBLEMAS: ${{ needs.actualizar.outputs.hay_problemas }}
          PROBLEMAS: ${{ needs.actualizar.outputs.problemas }}
        run: |
          if [ "$HAY_PROBLEMAS" = "true" ]; then
            {
              echo "## ⚠️ Fuentes con problemas"
              echo
              printf '%s\n' "$PROBLEMAS" | sed 's/^/- /'
              echo
              echo "La web se ha publicado igualmente con los datos anteriores."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Hay fuentes con problemas (ver el resumen)."
            exit 1
          fi
          echo "Las seis fuentes responden correctamente." >> "$GITHUB_STEP_SUMMARY"
